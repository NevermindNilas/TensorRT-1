name: build-py314-bindings

# Build the TensorRT Python bindings for CPython 3.14 (cp314), which NVIDIA
# ships no official wheel for. Compiles the Apache-2.0 pybind11 binding source
# against the public TensorRT GA package (headers + import libs) on Linux
# (x86_64) and Windows (amd64), and publishes the wheels in one GitHub Release.
#
# Version-parameterized + reusable (workflow_call): the auto-cp314 scheduler
# calls this with the latest publicly buildable version. A bare manual dispatch
# uses the defaults below (the current target). When `oss_ref` is set, the
# binding *source* is pulled from that upstream NVIDIA/TensorRT tag/branch at
# build time, so a new major version (e.g. 11.0) builds without re-vendoring.
#
# These are BINDINGS-ONLY wheels. The closed TensorRT runtime libs (~1.9GB)
# exceed GitHub's 2GB asset cap and are NOT bundled; the wheel's Requires-Dist
# pulls `tensorrt-cu13-libs` from `--extra-index-url https://pypi.nvidia.com`.
# No GPU needed to BUILD; importing needs an NVIDIA GPU + driver + runtime libs.

on:
  workflow_dispatch:
    inputs:
      trt_version:   { description: "Full TRT version (e.g. 10.16.1.11)", default: "10.16.1.11", type: string }
      trt_url_seg:   { description: "GA download path segment (e.g. 10.16.1)", default: "10.16.1", type: string }
      trt_short:     { description: "TRT version token for __init__ (e.g. 10.16.1)", default: "10.16.1", type: string }
      cuda_suffix:   { description: "GA package cuda suffix (e.g. 13.2)", default: "13.2", type: string }
      oss_ref:       { description: "Upstream OSS ref for binding source; empty = vendored python/", default: "", type: string }
      pybind11_ref:  { description: "pybind11 git ref to compile against", default: "v2.13.6", type: string }
      run_linux:     { description: "Build the Linux wheel", default: true, type: boolean }
      run_windows:   { description: "Build the Windows wheel", default: true, type: boolean }
  workflow_call:
    inputs:
      trt_version:   { required: true, type: string }
      trt_url_seg:   { required: true, type: string }
      trt_short:     { required: true, type: string }
      cuda_suffix:   { default: "13.2", type: string }
      oss_ref:       { default: "", type: string }
      pybind11_ref:  { default: "v2.13.6", type: string }
      run_linux:     { default: true, type: boolean }
      run_windows:   { default: true, type: boolean }

permissions:
  contents: write

env:
  # Run JS actions on Node24 (Node20 deprecated; forced default 2026-06-02)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ----------------------------------------------------------------- LINUX ---
  linux:
    if: ${{ inputs.run_linux }}
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:${{ inputs.cuda_suffix }}.0-devel-ubuntu24.04
    env:
      PY_MINOR: "14"
      TRT_VER: ${{ inputs.trt_version }}
      TRT_SHORT: ${{ inputs.trt_short }}
      CUDA_SUFFIX: ${{ inputs.cuda_suffix }}
      TRT_TARBALL: "TensorRT-${{ inputs.trt_version }}.Linux.x86_64-gnu.cuda-${{ inputs.cuda_suffix }}.tar.gz"
      TRT_URL: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{ inputs.trt_url_seg }}/tars/TensorRT-${{ inputs.trt_version }}.Linux.x86_64-gnu.cuda-${{ inputs.cuda_suffix }}.tar.gz"
    steps:
      - name: Install git + base tooling (needed before checkout)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates wget aria2 xz-utils tar \
            software-properties-common gnupg build-essential pkg-config

      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Sync binding source from upstream OSS ref
        if: ${{ inputs.oss_ref != '' }}
        run: |
          set -eux
          git clone --depth 1 --branch "${{ inputs.oss_ref }}" \
            https://github.com/NVIDIA/TensorRT /tmp/ossrc
          rm -rf python
          cp -r /tmp/ossrc/python python
          test -f python/scripts/process_wheel_template.py
          test -d python/packaging/bindings_wheel

      - name: Install CMake >= 3.27
        run: |
          set -eux
          wget -q https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-x86_64.sh
          sh cmake-3.27.9-linux-x86_64.sh --prefix=/usr/local --exclude-subdir --skip-license
          cmake --version

      - name: Install Python 3.${{ env.PY_MINOR }} (deadsnakes)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          PYV=3.${PY_MINOR}
          apt-get install -y --no-install-recommends python${PYV} python${PYV}-dev python${PYV}-venv
          python${PYV} --version

      - name: Download TensorRT GA (headers + import libs)
        run: |
          set -eux
          cd /opt
          df -h /opt /
          # aria2c: multi-connection + robust resume — the NVIDIA CDN drops
          # single-stream wget on this ~1.8GB file intermittently.
          aria2c -x16 -s16 --max-tries=10 --retry-wait=10 --timeout=60 \
                 --max-connection-per-server=16 --continue=true \
                 --file-allocation=none --summary-interval=10 \
                 -o "${TRT_TARBALL}" "${TRT_URL}"
          test "$(stat -c%s "${TRT_TARBALL}")" -gt 1000000000
          gzip -t "${TRT_TARBALL}"
          tar -xf "${TRT_TARBALL}"

      - name: Fetch pybind11 ${{ inputs.pybind11_ref }}
        run: |
          set -eux
          mkdir -p /opt/ext
          git clone --depth 1 --branch "${{ inputs.pybind11_ref }}" \
            https://github.com/pybind/pybind11 /opt/ext/pybind11
          test -f /opt/ext/pybind11/include/pybind11/pybind11.h

      - name: Stage Python headers into EXT_PATH layout
        run: |
          set -eux
          PYV=3.${PY_MINOR}
          DEST=/opt/ext/python${PYV}/include
          mkdir -p "${DEST}/x86_64-linux-gnu/python${PYV}"
          cp -r /usr/include/python${PYV}/* "${DEST}/"
          cp /usr/include/x86_64-linux-gnu/python${PYV}/pyconfig.h \
             "${DEST}/x86_64-linux-gnu/python${PYV}/"

      - name: Configure + build bindings (CMake, old python flow)
        run: |
          set -eux
          PYV=3.${PY_MINOR}
          TRT="/opt/TensorRT-${TRT_VER}"
          export EXT_PATH=/opt/ext
          cd python && mkdir -p build && cd build
          cmake .. \
            -DTRT_BUILD_ENABLE_NEW_PYTHON_FLOW=OFF \
            -DTENSORRT_MODULE=tensorrt \
            -DPYTHON_MAJOR_VERSION=3 -DPYTHON_MINOR_VERSION=${PY_MINOR} \
            -DTARGET=x86_64 -DEXT_PATH=${EXT_PATH} \
            -DTENSORRT_ROOT=${TRT} -DTENSORRT_LIBPATH=${TRT}/lib -DTENSORRT_BUILD=${TRT}/lib \
            -DCUDA_INCLUDE_DIRS=/usr/local/cuda/include -DONNX_INC_DIR=${TRT}/include \
            -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          find . -name "tensorrt*.so" -exec ls -la {} \;

      - name: Package bindings-only wheel
        run: |
          set -eux
          PYV=3.${PY_MINOR}; PY=python${PYV}
          ${PY} -m ensurepip --upgrade
          ${PY} -m pip install --upgrade pip wheel
          bash .github/scripts/make_wheel.sh \
            "$(pwd)/python/build/tensorrt/tensorrt.so" \
            "cp3${PY_MINOR}-cp3${PY_MINOR}-linux_x86_64" \
            "${PY}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl
          if-no-files-found: error

  # --------------------------------------------------------------- WINDOWS ---
  windows:
    if: ${{ inputs.run_windows }}
    runs-on: windows-2022
    env:
      PY_MINOR: "14"
      TRT_VER: ${{ inputs.trt_version }}
      TRT_SHORT: ${{ inputs.trt_short }}
      CUDA_SUFFIX: ${{ inputs.cuda_suffix }}
      TRT_ZIP: "TensorRT-${{ inputs.trt_version }}.Windows.amd64.cuda-${{ inputs.cuda_suffix }}.zip"
      TRT_URL: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{ inputs.trt_url_seg }}/zip/TensorRT-${{ inputs.trt_version }}.Windows.amd64.cuda-${{ inputs.cuda_suffix }}.zip"
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Sync binding source from upstream OSS ref
        if: ${{ inputs.oss_ref != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch "${{ inputs.oss_ref }}" `
            https://github.com/NVIDIA/TensorRT "$env:RUNNER_TEMP\ossrc"
          Remove-Item -Recurse -Force python
          Copy-Item -Recurse "$env:RUNNER_TEMP\ossrc\python" python
          if (-not (Test-Path python\scripts\process_wheel_template.py)) { throw "no template after sync" }

      - name: Set up Python 3.${{ env.PY_MINOR }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.${{ env.PY_MINOR }}"

      - name: Install CUDA toolkit (headers for compile)
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "${{ inputs.cuda_suffix }}.0"
          method: "network"
          # Full toolkit: subpackage split omits include/crt/* (host_defines.h)
          sub-packages: '[]'

      - name: Verify CUDA headers (crt/)
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          Get-ChildItem "$env:CUDA_PATH\include\crt\host_defines.h" | Select-Object FullName

      - name: Fetch pybind11 ${{ inputs.pybind11_ref }}
        run: git clone --depth 1 --branch "${{ inputs.pybind11_ref }}" https://github.com/pybind/pybind11 "$env:RUNNER_TEMP\ext\pybind11"

      - name: Download + unzip TensorRT GA (headers + import libs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP\$env:TRT_ZIP"
          Invoke-WebRequest -Uri $env:TRT_URL -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 15
          if ((Get-Item $zip).Length -lt 500000000) { throw "TRT zip too small" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Get-ChildItem "$env:RUNNER_TEMP\TensorRT-$env:TRT_VER\lib" -Filter *.lib | Select-Object Name

      - name: Stage Python headers/libs into EXT_PATH layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyv = "3.$env:PY_MINOR"
          $base = (python -c "import sys;print(sys.base_prefix)").Trim()
          $dest = "$env:RUNNER_TEMP\ext\python$pyv"
          New-Item -ItemType Directory -Force -Path "$dest\include\win\python$pyv" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest\lib" | Out-Null
          Copy-Item "$base\include\*" "$dest\include\" -Recurse -Force
          # old flow looks for pyconfig.h under include/win/python<ver>/
          Copy-Item "$base\include\pyconfig.h" "$dest\include\win\python$pyv\" -Force
          # CMake's old flow wants python3<minor>.lib (PYTHON_LIB_NAME)
          Copy-Item "$base\libs\python3$env:PY_MINOR.lib" "$dest\lib\python3$env:PY_MINOR.lib" -Force
          Get-ChildItem -Recurse "$dest" -Include Python.h,pyconfig.h,*.lib | Select-Object FullName

      - name: Configure + build bindings (MSVC, old python flow)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # CMake parses backslashes in -D values as escapes -> use forward slashes
          $trt = "$env:RUNNER_TEMP/TensorRT-$env:TRT_VER" -replace '\\','/'
          $ext = "$env:RUNNER_TEMP/ext" -replace '\\','/'
          $cuda = "$env:CUDA_PATH" -replace '\\','/'
          # $env: refs don't expand reliably in unquoted -D args -> use locals
          $pymin = $env:PY_MINOR
          $trtmaj = $env:TRT_VER.Split('.')[0]
          New-Item -ItemType Directory -Force -Path python\build | Out-Null
          cd python\build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DTRT_BUILD_ENABLE_NEW_PYTHON_FLOW=OFF `
            -DTENSORRT_MODULE=tensorrt `
            "-DPYTHON_MAJOR_VERSION=3" "-DPYTHON_MINOR_VERSION=$pymin" `
            "-DTARGET=x86_64" "-DEXT_PATH=$ext" `
            "-DTENSORRT_ROOT=$trt" "-DTENSORRT_LIBPATH=$trt/lib" "-DTENSORRT_BUILD=$trt/lib" `
            "-DTENSORRT_MAJOR_VERSION=$trtmaj" `
            "-DTRT_NVINFER_NAME=nvinfer" "-DTRT_ONNXPARSER_NAME=nvonnxparser" `
            "-DCUDA_INCLUDE_DIRS=$cuda/include" "-DONNX_INC_DIR=$trt/include"
          cmake --build . --config Release -- -m
          Get-ChildItem -Recurse -Include tensorrt.dll,tensorrt.pyd | Select-Object FullName,Length

      - name: Package bindings-only wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip wheel
          $pyd = Get-ChildItem -Recurse python\build -Include tensorrt.dll,tensorrt.pyd | Select-Object -First 1
          if (-not $pyd) { throw "binding module not found" }
          & "$env:GITHUB_WORKSPACE\.github\scripts\make_wheel.ps1" `
            -Module $pyd.FullName -Tag "cp3$env:PY_MINOR-cp3$env:PY_MINOR-win_amd64"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl
          if-no-files-found: error

  # --------------------------------------------------------------- RELEASE ---
  release:
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-24.04
    env:
      PY_MINOR: "14"
      TRT_VER: ${{ inputs.trt_version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -la artifacts/ || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TRT_VER }}-cp3${{ env.PY_MINOR }}
          name: TensorRT ${{ env.TRT_VER }} bindings for CPython 3.${{ env.PY_MINOR }} (unofficial)
          body: |
            **Unofficial** build of the NVIDIA TensorRT ${{ env.TRT_VER }} Python
            **bindings** for **CPython 3.${{ env.PY_MINOR }}** (`cp3${{ env.PY_MINOR }}`), which
            NVIDIA ships no official wheel for.

            **Bindings-only** wheels (Linux x86_64 + Windows amd64). The closed
            TensorRT runtime libs (~1.9GB) exceed GitHub's 2GB asset cap and are
            **not bundled** — the wheel's `Requires-Dist` pulls
            `tensorrt-cu13-libs==${{ env.TRT_VER }}` from NVIDIA's index:

            ```
            pip install <wheel-url> --extra-index-url https://pypi.nvidia.com
            ```

            - pybind11 binding source (Apache-2.0) compiled against the TRT GA package.
            - Built on CPU runners (no GPU to build); needs an NVIDIA GPU + driver
              + the runtime libs to import/run.
            - Not affiliated with or endorsed by NVIDIA.
          files: artifacts/*.whl
          fail_on_unmatched_files: false
