name: build-py314-bindings

# Build the TensorRT Python bindings (old build flow) for CPython 3.14 (cp314),
# which NVIDIA ships no official wheel for. Compiles the Apache-2.0 pybind11
# binding source against the public TensorRT 10.16 GA tarball (headers +
# libnvinfer.so), assembles a standalone wheel (bindings + bundled closed libs)
# and publishes it as a GitHub Release.
#
# No GPU needed to BUILD (CUDA headers only; links the closed libnvinfer).
# The resulting wheel needs an NVIDIA GPU + driver + CUDA runtime to import/run.

on:
  workflow_dispatch:
    inputs:
      pybind11_ref:
        description: "pybind11 git ref (tag/branch) to compile against"
        default: "v2.13.6"
        type: string

env:
  TRT_VER: "10.16.0.72"
  TRT_TARBALL: "TensorRT-10.16.0.72.Linux.x86_64-gnu.cuda-13.2.tar.gz"
  TRT_URL: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/10.16.0/tars/TensorRT-10.16.0.72.Linux.x86_64-gnu.cuda-13.2.tar.gz"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.2.0-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        # cp313 already ships officially; it was only a control to prove the
        # harness. cp314 built green, so the control is moot — cp314 only.
        py_minor: ["14"]
    steps:
      - name: Install git + base tooling (needed before checkout)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates wget xz-utils tar \
            software-properties-common gnupg \
            build-essential pkg-config

      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install CMake >= 3.27
        run: |
          set -eux
          wget -q https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-x86_64.sh
          sh cmake-3.27.9-linux-x86_64.sh --prefix=/usr/local --exclude-subdir --skip-license
          cmake --version

      - name: Install Python 3.${{ matrix.py_minor }} (deadsnakes)
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          PYV=3.${{ matrix.py_minor }}
          apt-get install -y --no-install-recommends python${PYV} python${PYV}-dev python${PYV}-venv
          python${PYV} --version
          echo "Headers:"; ls -la /usr/include/python${PYV}/ | head
          echo "pyconfig:"; ls -la /usr/include/x86_64-linux-gnu/python${PYV}/ || true

      - name: Download TensorRT ${{ env.TRT_VER }} GA (headers + libs)
        run: |
          set -eux
          cd /opt
          # Big (~1.8GB) file off NVIDIA CDN drops intermittently; retry + resume.
          for attempt in 1 2 3 4 5; do
            wget --continue --tries=3 --timeout=60 --waitretry=15 \
                 -O "${TRT_TARBALL}" "${TRT_URL}" && break
            echo "download attempt ${attempt} failed; retrying"; sleep 10
          done
          # Fail loudly if the archive is short/corrupt rather than letting tar guess.
          test "$(stat -c%s "${TRT_TARBALL}")" -gt 1000000000
          gzip -t "${TRT_TARBALL}"
          tar -xf "${TRT_TARBALL}"
          ls "TensorRT-${TRT_VER}"
          echo "=== include has NvInfer / NvOnnxParser? ==="
          ls "TensorRT-${TRT_VER}/include" | grep -iE "NvInfer\.h|NvOnnxParser\.h" || true
          echo "=== libs ==="
          ls "TensorRT-${TRT_VER}/lib" | grep -iE "nvinfer|nvonnxparser" | head

      - name: Fetch pybind11 ${{ inputs.pybind11_ref }}
        run: |
          set -eux
          mkdir -p /opt/ext
          git clone --depth 1 --branch "${{ inputs.pybind11_ref }}" \
            https://github.com/pybind/pybind11 /opt/ext/pybind11
          test -f /opt/ext/pybind11/include/pybind11/pybind11.h
          grep -m1 "version" /opt/ext/pybind11/include/pybind11/detail/common.h | head || true

      - name: Stage Python headers into EXT_PATH layout
        run: |
          set -eux
          PYV=3.${{ matrix.py_minor }}
          DEST=/opt/ext/python${PYV}/include
          mkdir -p "${DEST}/x86_64-linux-gnu/python${PYV}"
          cp -r /usr/include/python${PYV}/* "${DEST}/"
          # old flow looks for pyconfig.h at <include>/x86_64-linux-gnu/python<ver>/
          cp /usr/include/x86_64-linux-gnu/python${PYV}/pyconfig.h \
             "${DEST}/x86_64-linux-gnu/python${PYV}/"
          echo "=== staged layout ==="
          find /opt/ext/python${PYV} -name "Python.h" -o -name "pyconfig.h"

      - name: Configure (CMake, old python flow)
        run: |
          set -eux
          PYV=3.${{ matrix.py_minor }}
          TRT="/opt/TensorRT-${TRT_VER}"
          export EXT_PATH=/opt/ext
          cd python
          mkdir -p build && cd build
          cmake .. \
            -DTRT_BUILD_ENABLE_NEW_PYTHON_FLOW=OFF \
            -DTENSORRT_MODULE=tensorrt \
            -DPYTHON_MAJOR_VERSION=3 \
            -DPYTHON_MINOR_VERSION=${{ matrix.py_minor }} \
            -DTARGET=x86_64 \
            -DEXT_PATH=${EXT_PATH} \
            -DTENSORRT_ROOT=${TRT} \
            -DTENSORRT_LIBPATH=${TRT}/lib \
            -DTENSORRT_BUILD=${TRT}/lib \
            -DCUDA_INCLUDE_DIRS=/usr/local/cuda/include \
            -DONNX_INC_DIR=${TRT}/include \
            -DCMAKE_BUILD_TYPE=Release \
            -DVERBOSE=ON

      - name: Build bindings
        run: |
          set -eux
          cd python/build
          make -j"$(nproc)" VERBOSE=1

      - name: Show built artifacts
        run: |
          set -eux
          find python/build -name "tensorrt*.so" -exec ls -la {} \;

      - name: Assemble standalone cp3${{ matrix.py_minor }} wheel
        run: |
          set -eux
          PYV=3.${{ matrix.py_minor }}
          PY=python${PYV}
          TRT="/opt/TensorRT-${TRT_VER}"
          # pip/wheel tooling inside the target interpreter
          ${PY} -m ensurepip --upgrade
          ${PY} -m pip install --upgrade pip wheel

          WHL=/tmp/whl
          rm -rf "${WHL}"
          mkdir -p "${WHL}/tensorrt" "${WHL}/tensorrt_libs" \
                   "${WHL}/tensorrt-${TRT_VER}.dist-info"

          # 1) Processed __init__ (fills ##TOKENS##)
          ${PY} python/scripts/process_wheel_template.py \
            --src-dir python/packaging/bindings_wheel \
            --dst-dir "${WHL}" \
            --filepath tensorrt/__init__.py \
            --trt-module tensorrt \
            --trt-py-version "${TRT_VER}" \
            --cuda-version 13.2 \
            --trt-version 10.16.0 \
            --trt-nvinfer-name nvinfer \
            --trt-onnxparser-name nvonnxparser \
            --plugin-disabled 0
          # Fail if any template token survived
          ! grep -q '##' "${WHL}/tensorrt/__init__.py"

          # 2) The cp3xx binding + closed TRT libs (rpath is $ORIGIN/../tensorrt_libs).
          # zipfile follows symlinks, so copy ONE dereferenced real file per
          # loadable name (soname for core libs; exact name for builder resources)
          # to avoid 3x duplication blowing past the release asset size limit.
          cp python/build/tensorrt/tensorrt.so "${WHL}/tensorrt/"
          ( cd "${TRT}/lib"
            for f in *.so.10; do
              [ -e "$f" ] && cp -L "$f" "${WHL}/tensorrt_libs/"
            done
            for f in libnvinfer_builder_resource*.so.10.16.0; do
              [ -e "$f" ] && cp -L "$f" "${WHL}/tensorrt_libs/"
            done
          )
          printf '# bundled closed-source TensorRT runtime libraries\n' \
            > "${WHL}/tensorrt_libs/__init__.py"
          echo "=== bundled libs ==="; ls -la "${WHL}/tensorrt_libs/"
          du -sh "${WHL}/tensorrt_libs/"

          # 3) Wheel metadata (platform tag — installable from file, not PyPI)
          MD="${WHL}/tensorrt-${TRT_VER}.dist-info/METADATA"
          {
            printf 'Metadata-Version: 2.1\n'
            printf 'Name: tensorrt\n'
            printf 'Version: %s\n' "${TRT_VER}"
            printf 'Summary: UNOFFICIAL CPython %s build of TensorRT 10.16 bindings (POC)\n' "${PYV}"
            printf 'Home-page: https://github.com/NevermindNilas/tensorrt-py3.14\n'
            printf 'License: Apache-2.0 bindings + NVIDIA proprietary EULA for libs\n'
          } > "${MD}"
          WH="${WHL}/tensorrt-${TRT_VER}.dist-info/WHEEL"
          {
            printf 'Wheel-Version: 1.0\n'
            printf 'Generator: tas-cp314-poc\n'
            printf 'Root-Is-Purelib: false\n'
            printf 'Tag: cp%s-cp%s-linux_x86_64\n' "${{ matrix.py_minor }}" "${{ matrix.py_minor }}"
          } > "${WH}"

          # 4) Pack
          mkdir -p dist
          ${PY} -m wheel pack "${WHL}" -d dist
          echo "=== built wheel ==="
          ls -la dist/
          ${PY} -m zipfile -l dist/*.whl | head -40

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensorrt-cp3${{ matrix.py_minor }}-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TRT_VER }}-cp3${{ matrix.py_minor }}
          name: TensorRT ${{ env.TRT_VER }} bindings for CPython 3.${{ matrix.py_minor }} (unofficial)
          body: |
            **Unofficial** proof-of-concept build of the NVIDIA TensorRT
            ${{ env.TRT_VER }} Python bindings for **CPython 3.${{ matrix.py_minor }}** (`cp3${{ matrix.py_minor }}`),
            which NVIDIA does not ship an official wheel for.

            - Bindings (pybind11) compiled from the Apache-2.0 OSS source.
            - Bundles the closed-source TensorRT runtime libs (NVIDIA EULA applies).
            - Built on a CPU runner (no GPU needed to build); **requires an
              NVIDIA GPU + driver + CUDA runtime at import/runtime**.
            - Platform-tagged `linux_x86_64`: install from file, e.g.
              `pip install ./tensorrt-${{ env.TRT_VER }}-cp3${{ matrix.py_minor }}-cp3${{ matrix.py_minor }}-linux_x86_64.whl`
            - Not affiliated with or endorsed by NVIDIA.
          files: dist/*.whl
          fail_on_unmatched_files: true
